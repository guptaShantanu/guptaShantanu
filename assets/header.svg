<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Terminal: Shantanu Gupta, Full-stack and AI Engineer">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1a2442" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="10%" r="70%">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="5%" cy="100%" r="60%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="500" rx="16"/></clipPath>

    <clipPath id="c1"><rect x="0" y="70" height="34" width="0"><animate attributeName="width" from="0" to="1000" begin="0.4s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="160" height="34" width="0"><animate attributeName="width" from="0" to="1000" begin="2.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="282" height="34" width="0"><animate attributeName="width" from="0" to="1000" begin="3.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="372" height="34" width="0"><animate attributeName="width" from="0" to="1000" begin="5.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .cmd { font-size: 17px; fill: #e2e8f0; }
    .ps { fill: #4ade80; font-weight: 700; }
    .path { fill: #7dd3fc; }
    .out { font-size: 16px; fill: #94a3b8; }
    .key { fill: #c084fc; }
    .str { fill: #fbbf24; }
    .ok { fill: #4ade80; font-weight: 700; }
    .dir1 { fill: #22d3ee; font-weight: 700; }
    .dir2 { fill: #60a5fa; font-weight: 700; }
    .dir3 { fill: #a78bfa; font-weight: 700; }
    .dir4 { fill: #f0abfc; font-weight: 700; }
    .fade { opacity: 0; animation: in 0.5s ease-out forwards; }
    .blink { animation: blink 1s steps(1, end) infinite; }
    @keyframes in { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="500" fill="#0b1020"/>
    <rect width="1000" height="500" fill="url(#grid)"/>
    <rect width="1000" height="500" fill="url(#glow)"/>
    <rect width="1000" height="500" fill="url(#glow2)"/>
    <rect x="0" y="-120" width="1000" height="120" fill="url(#scan)">
      <animate attributeName="y" from="-120" to="500" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Title bar -->
    <rect width="1000" height="44" fill="#0e1530"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#1f2a4d"/>
    <circle cx="26" cy="22" r="6.5" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="6.5" fill="#febc2e"/>
    <circle cx="70" cy="22" r="6.5" fill="#28c840"/>
    <text x="500" y="27" text-anchor="middle" class="mono" font-size="13" fill="#64748b">shantanu@eureka: ~/products — zsh — 7+ yrs uptime</text>
    <circle cx="920" cy="22" r="4.5" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="932" y="26.5" class="mono" font-size="12" fill="#4ade80">online</text>

    <!-- 1: whoami -->
    <g clip-path="url(#c1)">
      <text x="32" y="94" class="mono cmd"><tspan class="ps">➜</tspan> <tspan class="path">~</tspan> whoami</text>
    </g>
    <text x="32" y="140" class="mono fade" style="animation-delay:1.2s" font-size="34" font-weight="800" fill="url(#name)" letter-spacing="-0.5">Shantanu Gupta</text>
    <text x="330" y="139" class="mono out fade" style="animation-delay:1.45s">// Full-stack &amp; AI Engineer · Bangalore, IN</text>

    <!-- 2: cat role.yml -->
    <g clip-path="url(#c2)">
      <text x="32" y="184" class="mono cmd"><tspan class="ps">➜</tspan> <tspan class="path">~</tspan> cat role.yml</text>
    </g>
    <text x="32" y="216" class="mono out fade" style="animation-delay:2.8s"><tspan class="key">role</tspan>: <tspan class="str">"Senior Manager, Tech @ Eureka Forbes"</tspan></text>
    <text x="32" y="242" class="mono out fade" style="animation-delay:3.0s"><tspan class="key">hats</tspan>: [<tspan class="str">Solution Architect</tspan>, <tspan class="str">AI Solution Architect</tspan>, <tspan class="str">Team Lead</tspan>]</text>
    <text x="32" y="268" class="mono out fade" style="animation-delay:3.2s"><tspan class="key">motto</tspan>: <tspan class="str">"Models that ship, not demos."</tspan></text>

    <!-- 3: ls layers -->
    <g clip-path="url(#c3)">
      <text x="32" y="306" class="mono cmd"><tspan class="ps">➜</tspan> <tspan class="path">~</tspan> ls ./every-layer</text>
    </g>
    <text x="32" y="340" xml:space="preserve" class="mono out fade" style="animation-delay:4.4s"><tspan class="dir1">frontend/</tspan>    <tspan class="dir2">backend/</tspan>    <tspan class="dir3">database/</tspan>    <tspan class="dir4">ai/</tspan>      <tspan fill="#475569"># one owner. no hand-offs.</tspan></text>

    <!-- 4: ship -->
    <g clip-path="url(#c4)">
      <text x="32" y="396" class="mono cmd"><tspan class="ps">➜</tspan> <tspan class="path">~</tspan> ./ship --to production</text>
    </g>
    <text x="32" y="430" xml:space="preserve" class="mono out fade" style="animation-delay:6.0s"><tspan class="ok">✓</tspan> 10+ products shipped   <tspan class="ok">✓</tspan> 1M+ users served   <tspan class="ok">✓</tspan> 6+ enterprise brands</text>

    <!-- prompt -->
    <g class="fade" style="animation-delay:6.6s">
      <text x="32" y="474" class="mono cmd"><tspan class="ps">➜</tspan> <tspan class="path">~</tspan></text>
      <rect x="74" y="460" width="10" height="19" fill="#7dd3fc" class="blink"/>
    </g>

    <rect x="0.5" y="0.5" width="999" height="499" rx="15.5" fill="none" stroke="#1f2a4d"/>
  </g>
</svg>
