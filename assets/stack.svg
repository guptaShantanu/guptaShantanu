<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Request lifecycle through four layers: Frontend, Backend, Database, AI, all owned by one engineer">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c2747"/>
    </pattern>
    <linearGradient id="track" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.33" stop-color="#60a5fa"/>
      <stop offset="0.66" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-size: 12px; fill: #64748b; letter-spacing: 1.5px; }
    .name { font-size: 20px; font-weight: 800; }
    .tool { font-size: 13px; fill: #cbd5e1; }
    .tag { font-size: 11px; fill: #64748b; }
    .flow { stroke-dasharray: 6 6; animation: flow 0.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#0b1020"/>
    <rect width="1000" height="300" fill="url(#g)"/>

    <text x="24" y="34" class="mono label">// REQUEST_LIFECYCLE — ONE OWNER, EVERY LAYER</text>
    <text x="976" y="34" text-anchor="end" class="mono label" style="fill:#4ade80">● LIVE</text>

    <!-- connectors -->
    <g stroke-width="2" fill="none">
      <line x1="224" y1="135" x2="277" y2="135" stroke="#60a5fa" class="flow"/>
      <line x1="477" y1="135" x2="530" y2="135" stroke="#a78bfa" class="flow"/>
      <line x1="730" y1="135" x2="783" y2="135" stroke="#f0abfc" class="flow"/>
    </g>

    <!-- FRONTEND -->
    <g>
      <rect x="24" y="60" width="200" height="150" rx="12" fill="#0f172e" stroke-width="1.5">
        <animate attributeName="stroke" values="#22d3ee;#22d3ee;#26314f;#26314f" keyTimes="0;0.2;0.23;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="44" y="92" class="mono tag">01 · CLIENT</text>
      <text x="44" y="120" class="mono name" fill="#22d3ee">Frontend</text>
      <text x="44" y="148" class="mono tool">Flutter · Dart</text>
      <text x="44" y="168" class="mono tool">Next.js · Kotlin</text>
      <text x="44" y="192" class="mono tag">android · ios · web</text>
    </g>

    <!-- BACKEND -->
    <g>
      <rect x="277" y="60" width="200" height="150" rx="12" fill="#0f172e" stroke-width="1.5">
        <animate attributeName="stroke" values="#26314f;#26314f;#60a5fa;#60a5fa;#26314f;#26314f" keyTimes="0;0.26;0.29;0.47;0.5;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="297" y="92" class="mono tag">02 · SERVICES</text>
      <text x="297" y="120" class="mono name" fill="#60a5fa">Backend</text>
      <text x="297" y="148" class="mono tool">Node.js · TypeScript</text>
      <text x="297" y="168" class="mono tool">gRPC · REST · Cache</text>
      <text x="297" y="192" class="mono tag">benchmarked @ 1M users</text>
    </g>

    <!-- DATABASE -->
    <g>
      <rect x="530" y="60" width="200" height="150" rx="12" fill="#0f172e" stroke-width="1.5">
        <animate attributeName="stroke" values="#26314f;#26314f;#a78bfa;#a78bfa;#26314f;#26314f" keyTimes="0;0.52;0.55;0.73;0.76;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="550" y="92" class="mono tag">03 · STATE</text>
      <text x="550" y="120" class="mono name" fill="#a78bfa">Database</text>
      <text x="550" y="148" class="mono tool">PostgreSQL · MongoDB</text>
      <text x="550" y="168" class="mono tool">Firestore · pgvector</text>
      <text x="550" y="192" class="mono tag">live · relational · vector</text>
    </g>

    <!-- AI -->
    <g>
      <rect x="783" y="60" width="193" height="150" rx="12" fill="#0f172e" stroke-width="1.5">
        <animate attributeName="stroke" values="#26314f;#26314f;#f0abfc;#f0abfc" keyTimes="0;0.78;0.81;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="803" y="92" class="mono tag">04 · INTELLIGENCE</text>
      <text x="803" y="120" class="mono name" fill="#f0abfc">AI</text>
      <text x="803" y="148" class="mono tool">LLMs · RAG · Agents</text>
      <text x="803" y="168" class="mono tool">MCP · Evals</text>
      <text x="803" y="192" class="mono tag">guardrails · cost limits</text>
    </g>

    <!-- packet track -->
    <line x1="24" y1="250" x2="976" y2="250" stroke="#1f2a4d" stroke-width="2"/>
    <line x1="24" y1="250" x2="976" y2="250" stroke="url(#track)" stroke-width="2" opacity="0.35"/>
    <g>
      <circle cy="250" r="9" fill="#7dd3fc" filter="url(#soft)" opacity="0.8">
        <animate attributeName="cx" from="24" to="976" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cy="250" r="4" fill="#ffffff">
        <animate attributeName="cx" from="24" to="976" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="24" y="280" class="mono tag">user tap</text>
    <text x="976" y="280" text-anchor="end" class="mono tag">smart response → production</text>

    <rect x="0.5" y="0.5" width="999" height="299" rx="15.5" fill="none" stroke="#1f2a4d"/>
  </g>
</svg>
